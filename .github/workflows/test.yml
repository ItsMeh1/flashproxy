name: Flash Proxy checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: node --check server.js && node --check src/url.js && node --check rewriters/html.js && node --check rewriters/css.js && node --check rewriters/runtime.js && node --check rewriters/js/rewriter.js
      - name: Run tests
        run: npm test
      - name: Verify package JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
