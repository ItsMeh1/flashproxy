<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flash Proxy Lite — a static browser-side web proxy toolkit.">
  <meta name="theme-color" content="#090b10">
  <title>Flash Proxy Lite ⚡</title>
  <style>html,body{margin:0;min-height:100%;background:#090b10}body{overflow:hidden}</style>
</head>
<body>
  <noscript>Flash Proxy Lite needs JavaScript enabled.</noscript>
  <script src="./src/flashproxy-core.js"></script>
  <script src="./src/flashproxy-strategies.js"></script>
  <script src="./src/flashproxy-rewriter.js"></script>
  <script src="./src/flashproxy-ui.js"></script>
  <script>
    (() => {
      const proxy = new FlashProxyLite({
        // A static page cannot bypass CORS. Try browser-readable content first,
        // then use a configured remote CORS endpoint if one is available.
        strategyOrder: ['direct', 'corsproxy'],
        rewriteHtml: true,
        timeout: 15000,
        maxRetries: 1,
        enableServiceWorker: false
      });
      const ui = new FlashProxyUI(proxy, document.body).mount();
      proxy.init().catch(error => console.error('[Flash Proxy Lite] init failed:', error));
      const target = new URLSearchParams(location.search).get('url');
      if (target) proxy.navigate(target).catch(() => {});
      globalThis.flashProxy = proxy;
      globalThis.flashProxyUI = ui;
    })();
  </script>
</body>
</html>
