<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FlashProxy Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chrome">
        <div id="nav-bar">
            <button id="back">←</button>
            <button id="forward">→</button>
            <button id="reload">↻</button>
            <input id="address-bar" type="text" placeholder="Enter URL or search..." value="example.com">
            <button id="go">Go</button>
        </div>
    </div>
    <div id="browser-container"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
