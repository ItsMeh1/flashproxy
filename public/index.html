<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FlashProxy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chrome">
        <div id="nav-bar">
            <button id="back">←</button>
            <button id="forward">→</button>
            <button id="reload">↻</button>
            <input id="address-bar" type="text" placeholder="Enter URL or search..." value="example.com">
            <button id="go">Go</button>
        </div>
    </div>
    <iframe id="browser-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
    <script src="main.js"></script>
</body>
</html>
