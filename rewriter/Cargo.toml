[package]
name = "flashproxy-rewriter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
oxc_allocator = "0.29"
oxc_parser = "0.29"
oxc_span = "0.29"
oxc_ast = "0.29"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
